name: Release

# Triggers when you push a version tag: git tag v1.0.7 && git push origin v1.0.7
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # tauri-apps/tauri-action@v0 targets Tauri v1.x
      # It builds the app, signs the installer with TAURI_PRIVATE_KEY,
      # creates a GitHub Release, and uploads:
      #   - braxon_X.Y.Z_x64-setup.exe  (NSIS installer)
      #   - braxon_X.Y.Z_x64-setup.exe.sig  (signature)
      #   - latest.json  (update manifest the app polls)
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BRAXON ${{ github.ref_name }}'
          releaseBody: 'Download the installer below. Running instances of BRAXON will prompt for this update automatically.'
          releaseDraft: false
          prerelease: false
