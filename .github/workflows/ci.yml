name: CI

# Runs on every push and PR to the long-lived branches. Separate from
# release.yml, which only fires on version tags - by then a break has already
# shipped.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    # Matches the release runner. The app is Windows-only in practice: it
    # bundles an NSIS/MSI installer and resolves its config under %APPDATA%.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      # cargo check rather than build: this gate is about catching compile
      # errors, and the full link step is left to the release job.
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --all-targets
