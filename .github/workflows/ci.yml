name: CI

# Runs on every push and PR to the long-lived branches. Separate from
# release.yml, which only fires on version tags - by then a break has already
# shipped.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    # Matches the release runner. The app is Windows-only in practice: it
    # bundles an NSIS/MSI installer and resolves its config under %APPDATA%.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # npm install, not npm ci, and that is a known compromise.
      #
      # package-lock.json is generated on Windows, which does not fully resolve
      # optional wasm32 platform subtrees - here @rolldown/binding-wasm32-wasi,
      # pulled in by Vite 8, whose @napi-rs/wasm-runtime wants @emnapi/core and
      # @emnapi/runtime. npm ci validates the whole tree regardless of platform
      # and rejects the lock as out of sync over exactly those packages. Local
      # npm 11 tolerates it; the npm 10 shipped with Node 20 here does not.
      #
      # npm install fills the gap. It is weaker than npm ci: it can resolve
      # something the lock did not pin.
      #
      # Proper fix: regenerate package-lock.json somewhere that resolves those
      # subtrees (Linux, macOS, or a container) and switch this back to npm ci.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      # cargo check rather than build: this gate is about catching compile
      # errors, and the full link step is left to the release job.
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --all-targets
